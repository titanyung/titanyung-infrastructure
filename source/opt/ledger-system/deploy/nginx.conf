# Install only after ledger.titanyung.top resolves to this DMIT host and a certificate has been issued.
# This host's existing Nginx 443/24443 layout must be checked before using this template.
server {
    listen 80;
    listen [::]:80;
    server_name ledger.titanyung.top;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:24443 ssl;
    http2 on;
    port_in_redirect off;
    absolute_redirect off;
    server_name ledger.titanyung.top;
    ssl_certificate /etc/letsencrypt/live/ledger.titanyung.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.titanyung.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:28908;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
}
