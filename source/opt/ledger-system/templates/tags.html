{% extends 'base.html' %}
{% block title %}标签{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">管理</p><h1>标签</h1><p class="muted">录入账单时可直接输入新标签；这里也能预先创建。</p></div></div>
<section class="card"><h2>新增标签</h2><form method="post" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>标签名称<input name="name" maxlength="60" required></label><button class="primary" type="submit">新增</button></form></section>
<section class="card"><h2>已有标签</h2>{% if tags %}<div class="tag-list">{% for tag in tags %}<div class="tag-row"><form method="post" action="{{ url_for('tag_edit',tag_id=tag.id) }}" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>名称<input name="name" value="{{ tag.name }}" maxlength="60" required></label><span class="muted">已使用 {{ tag.uses }} 次</span><button type="submit">保存</button></form><form method="post" action="{{ url_for('tag_delete',tag_id=tag.id) }}" data-confirm="确定删除该标签？"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="delete"><button class="link-danger" type="submit" {{ 'disabled' if tag.uses else '' }}>删除</button></form></div>{% endfor %}</div>{% else %}<div class="empty">还没有标签。</div>{% endif %}</section>
{% endblock %}
