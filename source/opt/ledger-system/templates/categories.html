{% extends 'base.html' %}
{% block title %}消费项目{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">管理</p><h1>消费项目</h1><p class="muted">支持无限级子项目。创建后不可更改上级项目，名称和预算可以修改。</p></div></div>
<section class="card"><h2>新增项目</h2><p class="muted">当前账单周期：{{ period }}</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>名称<input name="name" maxlength="80" required></label><label>上级项目<select name="parent_id"><option value="">无 · 一级项目</option>{% for item in categories %}<option value="{{ item.id }}">{{ '　' * item.depth }}{{ item.name }}</option>{% endfor %}</select></label><label>每期预算（从本期生效）<input type="number" name="budget" min="0" step="0.01" value="0.00" required></label><div class="form-action"><button class="primary" type="submit">新增项目</button></div></form></section>
<section class="card"><h2>已有项目 · {{ month }} 周期</h2>{% if categories %}<div class="category-list">{% for item in categories %}<div class="category-row" style="--depth:{{ item.depth }}"><form method="post" action="{{ url_for('category_edit',category_id=item.id) }}" class="category-edit"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>项目名称<input name="name" maxlength="80" value="{{ item.name }}" required></label><label>每期预算<input type="number" name="budget" min="0" step="0.01" value="{{ '%.2f'|format(budget_for(item.id, month)/100) }}" required></label><button type="submit">保存</button></form><form method="post" action="{{ url_for('category_delete',category_id=item.id) }}" data-confirm="只有没有账单且没有子项目的项目才能删除。确定删除？"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="delete"><button type="submit" class="link-danger">删除</button></form></div>{% endfor %}</div>{% else %}<div class="empty">还没有消费项目。</div>{% endif %}</section>
{% endblock %}
